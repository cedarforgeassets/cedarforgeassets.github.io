  </defs>
  <rect width="256" height="256" rx="48" fill="url(#background)"/>
  <g fill="url(#needles)">
    <rect x="98" y="60" width="55" height="12" rx="6"/>
    <rect x="80" y="78" width="105" height="13" rx="6.5"/>
    <rect x="80" y="95" width="85" height="13" rx="6.5"/>
    <rect x="50" y="112" width="159" height="13" rx="6.5"/>
    <rect x="60" y="130" width="130" height="13" rx="6.5"/>
    <rect x="30" y="147" width="196" height="13" rx="6.5"/>
  </g>
  <rect x="120" y="165" width="16" height="32" rx="4" fill="url(#trunk)"/>
