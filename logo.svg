<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Cedarforge Assets tree logo</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a23"/>
      <stop offset="1" stop-color="#0c1511"/>
    </linearGradient>
    <linearGradient id="needles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82e0a6"/>
      <stop offset="1" stop-color="#42b976"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb45c"/>
